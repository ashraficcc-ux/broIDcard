<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ibrahim E. M. Ghazy — Identity Card</title>
  <style>
    /* =========================
       DESIGN VARIABLES
       Edit these values to restyle the whole card.
       ========================= */
    :root {
      /* Colours */
      --color-page-top: #dfeeff;
      --color-page-bottom: #f7fbff;
      --color-card-1: #174a7a;
      --color-card-2: #2f73ad;
      --color-card-3: #6bb7ec;
      --color-card-4: #163d65;
      --color-card-edge: rgba(255, 255, 255, 0.58);
      --color-card-edge-soft: rgba(255, 255, 255, 0.17);
      --color-sheen: rgba(255, 255, 255, 0.16);
      --color-text: #ffffff;
      --color-text-muted: rgba(255, 255, 255, 0.78);
      --color-label: rgba(224, 243, 255, 0.82);
      --color-divider: rgba(255, 255, 255, 0.22);
      --color-chip: rgba(5, 30, 54, 0.20);
      --color-chip-hover: rgba(255, 255, 255, 0.16);
      --color-social-disabled: rgba(220, 233, 244, 0.38);
      --color-photo-border: rgba(255, 255, 255, 0.78);
      --color-initials-bg: #2c6fa7;
      --color-shadow: rgba(16, 42, 66, 0.30);
      --color-button: #164c7d;
      --color-button-hover: #123f69;
      --color-button-text: #ffffff;
      --color-focus: #fff4a8;

      /* Physical card size */
      --card-width: 85.6mm;
      --card-height: 54mm;

      /* Size scale */
      --size-0: 0;
      --size-1: 1px;
      --size-2: 2px;
      --size-3: 3px;
      --size-4: 4px;
      --size-5: 5px;
      --size-6: 6px;
      --size-7: 7px;
      --size-8: 8px;
      --size-9: 9px;
      --size-10: 10px;
      --size-11: 11px;
      --size-12: 12px;
      --size-13: 13px;
      --size-14: 14px;
      --size-15: 15px;
      --size-16: 16px;
      --size-18: 18px;
      --size-20: 20px;
      --size-22: 22px;
      --size-24: 24px;
      --size-28: 28px;
      --size-32: 32px;
      --size-36: 36px;
      --size-40: 40px;
      --size-44: 44px;
      --size-48: 48px;
      --size-56: 56px;
      --size-64: 64px;
      --size-72: 72px;
      --size-86: 86px;
      --size-96: 96px;
      --size-120: 120px;
      --size-160: 160px;
      --size-240: 240px;
      --size-320: 320px;

      /* Spacing */
      --space-xxs: var(--size-3);
      --space-xs: var(--size-5);
      --space-sm: var(--size-8);
      --space-md: var(--size-12);
      --space-lg: var(--size-16);
      --space-xl: var(--size-24);
      --space-2xl: var(--size-32);

      /* Radii */
      --radius-card: var(--size-16);
      --radius-photo: var(--size-14);
      --radius-pill: var(--size-12);
      --radius-button: var(--size-12);
      --radius-focus: var(--size-6);

      /* Typography */
      --font-family: Arial, Helvetica, sans-serif;
      --font-name: var(--size-16);
      --font-role: var(--size-11);
      --font-org: var(--size-10);
      --font-label: var(--size-8);
      --font-value: var(--size-10);
      --font-button: var(--size-14);
      --weight-regular: 400;
      --weight-medium: 600;
      --weight-bold: 700;
      --line-tight: 1.08;
      --line-normal: 1.25;
      --letter-label: 0.08em;

      /* Layout */
      --page-min-height: 100vh;
      --page-padding: var(--size-18);
      --card-padding: var(--size-12);
      --left-column-width: 43%;
      --column-gap: var(--size-12);
      --photo-size: var(--size-86);
      --contact-row-min: var(--size-44);
      --social-size: var(--size-44);
      --icon-size: var(--size-18);
      --button-min-height: var(--size-44);
      --button-padding-x: var(--size-18);
      --button-gap: var(--size-16);

      /* Effects */
      --shadow-x: var(--size-0);
      --shadow-y: var(--size-18);
      --shadow-blur: var(--size-36);
      --shadow-spread: calc(var(--size-8) * -1);
      --edge-width: var(--size-1);
      --divider-width: var(--size-1);
      --focus-width: var(--size-3);
      --focus-offset: var(--size-3);
      --tilt-max: 3deg;
      --tilt-perspective: 900px;
      --tilt-duration: 180ms;
      --sheen-width: 42%;
      --sheen-angle: 24deg;
      --photo-scale: 1.02;
      --button-press: 1px;
    }

    /* =========================
       PAGE RESET & LAYOUT
       ========================= */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: var(--size-0);
      min-height: var(--page-min-height);
      font-family: var(--font-family);
      background: linear-gradient(160deg, var(--color-page-top), var(--color-page-bottom));
    }

    body {
      display: grid;
      place-items: center;
      padding: var(--page-padding);
    }

    .stage {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: var(--button-gap);
    }

    /* =========================
       IDENTITY CARD
       ========================= */
    .card {
      position: relative;
      isolation: isolate;
      width: var(--card-width);
      height: var(--card-height);
      overflow: hidden;
      border-radius: var(--radius-card);
      border: var(--edge-width) solid var(--color-card-edge);
      background:
        radial-gradient(circle at 78% 20%, var(--color-card-3) 0%, transparent 28%),
        linear-gradient(132deg, var(--color-card-1) 0%, var(--color-card-2) 49%, var(--color-card-4) 100%);
      box-shadow:
        var(--shadow-x) var(--shadow-y) var(--shadow-blur) var(--shadow-spread) var(--color-shadow),
        inset var(--edge-width) var(--edge-width) var(--size-0) var(--color-card-edge-soft);
      color: var(--color-text);
      transform-style: preserve-3d;
      transition: transform var(--tilt-duration) ease, box-shadow var(--tilt-duration) ease;
      will-change: transform;
    }

    .card::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: calc(var(--size-32) * -1);
      left: calc(var(--size-64) * -1);
      width: var(--sheen-width);
      height: calc(100% + var(--size-64));
      transform: rotate(var(--sheen-angle));
      background: linear-gradient(90deg, transparent, var(--color-sheen), transparent);
      pointer-events: none;
    }

    .card__inner {
      display: grid;
      grid-template-columns: var(--left-column-width) 1fr;
      gap: var(--column-gap);
      width: 100%;
      height: 100%;
      padding: var(--card-padding);
    }

    /* =========================
       LEFT SIDE: PHOTO & IDENTITY
       ========================= */
    .identity {
      min-width: var(--size-0);
      display: grid;
      align-content: start;
      gap: var(--space-xs);
      border-right: var(--divider-width) solid var(--color-divider);
      padding-right: var(--space-md);
    }

    .photo-wrap {
      position: relative;
      width: var(--photo-size);
      height: var(--photo-size);
      overflow: hidden;
      border-radius: var(--radius-photo);
      border: var(--edge-width) solid var(--color-photo-border);
      background: var(--color-initials-bg);
      box-shadow: inset var(--size-0) var(--size-0) var(--size-0) var(--edge-width) var(--color-card-edge-soft);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 24%;
      transform: scale(var(--photo-scale));
    }

    .photo-fallback {
      position: absolute;
      inset: var(--size-0);
      display: grid;
      place-items: center;
      font-size: var(--size-24);
      font-weight: var(--weight-bold);
      letter-spacing: var(--letter-label);
      color: var(--color-text);
      background: var(--color-initials-bg);
    }

    .name {
      margin: var(--size-0);
      font-size: var(--font-name);
      line-height: var(--line-tight);
      font-weight: var(--weight-bold);
    }

    .role {
      margin: var(--size-0);
      font-size: var(--font-role);
      line-height: var(--line-normal);
      font-weight: var(--weight-medium);
    }

    .org {
      margin: var(--size-0);
      font-size: var(--font-org);
      line-height: var(--line-normal);
      color: var(--color-text-muted);
    }

    /* =========================
       RIGHT SIDE: CONTACT DETAILS
       ========================= */
    .details {
      min-width: var(--size-0);
      display: grid;
      grid-template-rows: repeat(3, minmax(var(--contact-row-min), auto)) 1fr;
      align-content: stretch;
      gap: var(--space-xxs);
    }

    .contact {
      min-width: var(--size-0);
      min-height: var(--contact-row-min);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-pill);
      color: var(--color-text);
      text-decoration: none;
      background: var(--color-chip);
    }

    .contact:hover {
      background: var(--color-chip-hover);
    }

    .contact__label {
      font-size: var(--font-label);
      line-height: var(--line-tight);
      font-weight: var(--weight-bold);
      letter-spacing: var(--letter-label);
      text-transform: uppercase;
      color: var(--color-label);
    }

    .contact__value {
      margin-top: var(--space-xxs);
      font-size: var(--font-value);
      line-height: var(--line-normal);
      font-weight: var(--weight-medium);
      overflow-wrap: anywhere;
    }

    .location {
      cursor: default;
    }

    /* =========================
       SOCIAL ICONS
       ========================= */
    .socials {
      display: flex;
      align-items: end;
      gap: var(--space-xs);
      padding-top: var(--space-xxs);
    }

    .social {
      width: var(--social-size);
      height: var(--social-size);
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: var(--color-text);
      text-decoration: none;
      background: var(--color-chip);
    }

    .social svg {
      width: var(--icon-size);
      height: var(--icon-size);
      fill: currentColor;
    }

    .social[aria-disabled="true"] {
      color: var(--color-social-disabled);
      pointer-events: none;
      user-select: none;
    }

    /* =========================
       ACCESSIBILITY
       ========================= */
    a:focus-visible,
    button:focus-visible {
      outline: var(--focus-width) solid var(--color-focus);
      outline-offset: var(--focus-offset);
      border-radius: var(--radius-focus);
    }

    /* =========================
       PRINT BUTTON
       ========================= */
    .print-button {
      min-height: var(--button-min-height);
      padding: var(--size-0) var(--button-padding-x);
      border: var(--size-0);
      border-radius: var(--radius-button);
      font: var(--weight-bold) var(--font-button)/var(--line-normal) var(--font-family);
      color: var(--color-button-text);
      background: var(--color-button);
      cursor: pointer;
      box-shadow: var(--size-0) var(--size-8) var(--size-18) rgba(22, 76, 125, 0.22);
    }

    .print-button:hover {
      background: var(--color-button-hover);
    }

    .print-button:active {
      transform: translateY(var(--button-press));
    }

    /* =========================
       MOBILE FIT
       ========================= */
    @media (max-width: 360px) {
      :root {
        --page-padding: var(--size-8);
        --card-padding: var(--size-10);
        --column-gap: var(--size-8);
        --photo-size: var(--size-72);
        --font-name: var(--size-14);
        --font-role: var(--size-10);
        --font-org: var(--size-9);
        --font-value: var(--size-9);
      }

      .card {
        transform: scale(0.95);
      }
    }

    /* =========================
       REDUCED MOTION
       ========================= */
    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: none;
        transform: none !important;
      }
    }

    /* =========================
       PRINT: CARD ONLY, TRUE SIZE
       ========================= */
    @page {
      size: auto;
      margin: var(--size-0);
    }

    @media print {
      html,
      body {
        width: var(--card-width);
        height: var(--card-height);
        min-height: var(--card-height);
        margin: var(--size-0);
        padding: var(--size-0);
        background: transparent;
      }

      body {
        display: block;
      }

      .stage {
        display: block;
        width: var(--card-width);
        height: var(--card-height);
      }

      .card {
        width: var(--card-width);
        height: var(--card-height);
        margin: var(--size-0);
        transform: none !important;
        box-shadow: none;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .print-button {
        display: none;
      }
    }
  </style>
</head>

  <script>
    /* =========================
       PHOTO FALLBACK
       If the image cannot load, the initials remain visible.
       ========================= */
    const profilePhoto = document.getElementById('profilePhoto');
    const photoFallback = document.getElementById('photoFallback');

    profilePhoto.addEventListener('load', () => {
      photoFallback.style.display = 'none';
    });

    profilePhoto.addEventListener('error', () => {
      profilePhoto.style.display = 'none';
      photoFallback.style.display = 'grid';
    });

    /* =========================
       SUBTLE CURSOR TILT
       Disabled automatically when reduced motion is requested.
       ========================= */
    const card = document.getElementById('identityCard');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function getMotionSettings() {
      const styles = getComputedStyle(document.documentElement);
      return {
        maxTilt: parseFloat(styles.getPropertyValue('--tilt-max')),
        perspective: styles.getPropertyValue('--tilt-perspective').trim()
      };
    }

    function applyTilt(event) {
      if (reduceMotion.matches) return;

      const rect = card.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      const motion = getMotionSettings();
      const rotateY = (x - 0.5) * motion.maxTilt * 2;
      const rotateX = (0.5 - y) * motion.maxTilt * 2;

      card.style.transform = `perspective(${motion.perspective}) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }

    function resetTilt() {
      const motion = getMotionSettings();
      card.style.transform = `perspective(${motion.perspective}) rotateX(0deg) rotateY(0deg)`;
    }

    card.addEventListener('mousemove', applyTilt);
    card.addEventListener('mouseleave', resetTilt);

    reduceMotion.addEventListener('change', () => {
      if (reduceMotion.matches) {
        card.style.transform = 'none';
      }
    });

    /* =========================
       PRINT ACTION
       Browser print CSS hides everything except the card.
       ========================= */
    document.getElementById('printButton').addEventListener('click', () => {
      window.print();
    });
  </script>
